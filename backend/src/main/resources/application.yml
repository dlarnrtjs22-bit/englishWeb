spring:
  application:
    name: backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${app.database.host}:${app.database.port}/${app.database.database}?sslmode=require&ApplicationName=nativeflow-backend
    username: ${app.database.user}
    password: ${app.database.password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: NativeFlowHikariPool
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.nativeflow.backend.auth.model
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

server:
  port: 8080

