    port: 5432
    database: postgres
    user: postgres.fmqywfgjrktrfebgmfhg
    password: bnjrho12p!A
    pool-mode: session
  auth:
    jwt:
      secret: nativeflow-internal-auth-secret-key-for-jwt-signing-change-before-production-2026
      issuer: nativeflow
      access-token-validity-seconds: 3600
      refresh-token-validity-seconds: 604800
